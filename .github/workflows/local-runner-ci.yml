name: Local runner safety checks

on:
  pull_request:
  push:
    branches: [main, fix/local-runner-debug]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependency
        run: python -m pip install "PyYAML>=6.0.2"
      - name: Run regression tests
        run: python -m unittest discover -s tests
      - name: Validate workflow safety defaults
        run: python run_workflow.py validate
      - name: Verify dataset dry-run stays non-destructive
        run: python run_workflow.py dataset
