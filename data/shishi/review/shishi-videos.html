<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ヤマザキシシ 動画レビュー（アニメのみ）</title>
<style>
  :root { --bg:#0f1116; --card:#181b23; --line:#2a2f3a; --fg:#e8eaf0; --dim:#9aa3b2; --accent:#ff5d8f; --ok:#39d98a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; padding-bottom:120px; }
  header { position:sticky; top:0; z-index:10; background:rgba(15,17,22,.96); border-bottom:1px solid var(--line); padding:14px 18px; backdrop-filter:blur(8px); }
  h1 { font-size:17px; margin:0 0 4px; }
  .sub { color:var(--dim); font-size:12px; }
  .warn { margin-top:8px; font-size:12px; color:#ffd166; background:#2a2213; border:1px solid #4a3a17; border-radius:6px; padding:6px 9px; }
  .controls { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:10px; }
  button, input { font:inherit; color:var(--fg); background:var(--card); border:1px solid var(--line); border-radius:6px; padding:5px 10px; cursor:pointer; }
  button.active { border-color:var(--accent); color:var(--accent); }
  /* View selector */
  .view-group { display:flex; gap:4px; background:var(--card); border:1px solid var(--line); border-radius:6px; padding:3px; }
  .view-group button { border:none; background:transparent; padding:5px 12px; border-radius:4px; }
  .view-group button.active { background:var(--accent); color:#fff; }
  main.view-grid { grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); }
  main.view-list { grid-template-columns:1fr; }
  main.view-list .card { flex-direction:row; align-items:center; }
  main.view-list .thumb { flex:0 0 auto; width:200px; aspect-ratio:16/9; }
  main.view-list .body { flex:1; }
  main.view-list .dur { position:static; }
  @media (max-width:640px) {
    main.view-list .thumb { width:140px; }
  }
  input[type=search] { min-width:220px; cursor:text; }
  main { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px; padding:16px 18px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; display:flex; flex-direction:column; }
  .card.picked { border-color:var(--ok); box-shadow:0 0 0 1px var(--ok) inset; }
  .thumb { position:relative; aspect-ratio:16/9; background:#000; cursor:pointer; }
  .thumb img { width:100%; height:100%; object-fit:cover; display:block; }
  .thumb iframe { width:100%; height:100%; border:0; }
  .dur { position:absolute; right:6px; bottom:6px; background:rgba(0,0,0,.8); padding:1px 6px; border-radius:4px; font-size:12px; }
  .play { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:40px; color:rgba(255,255,255,.9); text-shadow:0 2px 10px #000; }
  .body { padding:10px 12px; display:flex; flex-direction:column; gap:6px; flex:1; }
  .title { font-size:13px; line-height:1.4; }
  .meta { color:var(--dim); font-size:11px; display:flex; gap:8px; flex-wrap:wrap; }
  .badge { border:1px solid var(--line); border-radius:999px; padding:0 7px; font-size:11px; }
  .badge.animation { color:#7cc4ff; border-color:#2b4a66; }
  .badge.uncertain { color:#ffd166; border-color:#5a4a1d; }
  .badge.live, .badge.tutorial, .badge.talk, .badge.promo, .badge.documentary { color:#8b93a3; }
  .note { color:#ffd166; font-size:11px; }
  .row { display:flex; gap:8px; align-items:center; margin-top:auto; }
  .row a { color:var(--dim); font-size:11px; }
  .pick { display:flex; gap:6px; align-items:center; font-size:12px; cursor:pointer; }
  footer { position:fixed; left:0; right:0; bottom:0; background:rgba(15,17,22,.97); border-top:1px solid var(--line); padding:10px 18px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .count { color:var(--ok); font-weight:600; }
  pre { display:none; position:fixed; left:18px; right:18px; bottom:64px; max-height:45vh; overflow:auto; background:#0b0d12; border:1px solid var(--line); border-radius:8px; padding:12px; font-size:12px; white-space:pre-wrap; z-index:20; }
  .empty { color:var(--dim); padding:30px; text-align:center; grid-column:1/-1; }
</style>
</head>
<body>
<header>
  <h1>ヤマザキシシ 動画レビュー — アニメのみ</h1>
  <div class="sub">公式 YouTube チャンネル（@shishinkooo）の公開メタデータのみ。動画ファイルは取得していません。</div>
  <div class="warn">ここで選んでも承認ではありません。権利確認と <code>permission_status: approved</code> は別ゲートです。選択結果は YAML 雛形（pending）として書き出せます。</div>
  <div class="controls">
    <button data-filter="animation" class="active">アニメのみ</button>
    <button data-filter="uncertain">不確実</button>
    <button data-filter="all">すべて</button>
    <label class="pick"><input type="checkbox" id="onlyPicked"> 選択のみ表示</label>
    <div class="view-group" id="viewGroup">
      <button data-view="grid" class="active" title="グリッド">▦</button>
      <button data-view="list" title="リスト">≡</button>
    </div>
    <input type="search" id="q" placeholder="タイトル・ID で検索">
    <span class="sub" id="shown"></span>
  </div>
</header>
<main id="grid"></main>
<footer>
  <span>選択: <span class="count" id="count">0</span> 本</span>
  <button id="export">選択を YAML でコピー</button>
  <button id="exportJson">JSON でコピー</button>
  <button id="clear">選択をクリア</button>
  <span class="sub">選んだ本数はブラウザに保存されます</span>
</footer>
<pre id="out"></pre>

const LABEL = { animation:"アニメ", uncertain:"不確実", live:"実写/日常", tutorial:"制作/講座", talk:"トーク", promo:"告知", documentary:"記録" };
const KEY = "shishi-review-v1";
let picked = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
let filter = "animation";
let query = "";
let onlyPicked = false;

const grid = document.getElementById("grid");

function fmtDur(s) { const m = Math.floor(s/60), r = s%60; return m + ":" + String(r).padStart(2,"0"); }
function save() { localStorage.setItem(KEY, JSON.stringify([...picked])); }
function esc(s) { return s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function visible() {
  return ITEMS.filter(it => {
    if (filter === "animation" && it.category !== "animation") return false;
    if (filter === "uncertain" && it.category !== "uncertain") return false;
    if (onlyPicked && !picked.has(it.id)) return false;
    if (query && !(it.title + " " + it.id).toLowerCase().includes(query)) return false;
    return true;
  });
}

function render() {
  const list = visible();
  grid.innerHTML = "";
  if (!list.length) { grid.innerHTML = '<div class="empty">' + (onlyPicked ? '選択がありません。カードの「候補」にチェックしてください。' : '該当なし') + '</div>'; }
  for (const it of list) {
    const card = document.createElement("article");
    card.className = "card" + (picked.has(it.id) ? " picked" : "");
    card.innerHTML = `
      <div class="thumb" data-play="${it.id}">
        <img loading="lazy" src="https://i.ytimg.com/vi/${it.id}/hqdefault.jpg" alt="">
        <div class="play">▶</div>
        <div class="dur">${fmtDur(it.duration)}</div>
      </div>
      <div class="body">
        <div class="title">${esc(it.title)}</div>
        <div class="meta">
          <span class="badge ${it.category}">${LABEL[it.category] || it.category}</span>
          <span>${it.views.toLocaleString()} views</span>
          <span>#${String(it.i).padStart(2,"0")}</span>
        </div>
        ${it.note ? `<div class="note">${esc(it.note)}</div>` : ""}
        <div class="row">
          <label class="pick"><input type="checkbox" ${picked.has(it.id) ? "checked" : ""} data-pick="${it.id}"> 候補</label>
          <a href="${it.url}" target="_blank" rel="noreferrer">YouTube で開く</a>
          <a href="https://www.youtube.com/watch?v=${it.id}&t=0s" target="_blank" rel="noreferrer">新しいタブ</a>
        </div>
      </div>`;
    grid.appendChild(card);
  }
  document.getElementById("shown").textContent = list.length + " 本";
  document.getElementById("count").textContent = picked.size;
}

grid.addEventListener("click", e => {
  const thumb = e.target.closest("[data-play]");
  if (!thumb) return;
  const id = thumb.dataset.play;
  if (thumb.querySelector("iframe")) return;
  thumb.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
});

grid.addEventListener("change", e => {
  const box = e.target.closest("[data-pick]");
  if (!box) return;
  const id = box.dataset.pick;
  if (box.checked) picked.add(id); else picked.delete(id);
  box.closest(".card").classList.toggle("picked", box.checked);
  document.getElementById("count").textContent = picked.size;
  save();
  if (onlyPicked && !box.checked) render();
});

for (const b of document.querySelectorAll("[data-view]")) {
  b.addEventListener("click", () => {
    const v = b.dataset.view;
    document.querySelectorAll("[data-view]").forEach(x => x.classList.toggle("active", x === b));
    grid.className = "view-" + v;
    localStorage.setItem("shishi-view-v1", v);
  });
}
const savedView = localStorage.getItem("shishi-view-v1") || "grid";
grid.className = "view-" + savedView;
document.querySelectorAll("[data-view]").forEach(x => x.classList.toggle("active", x.dataset.view === savedView));

for (const b of document.querySelectorAll("[data-filter]")) {
  b.addEventListener("click", () => {
    filter = b.dataset.filter;
    document.querySelectorAll("[data-filter]").forEach(x => x.classList.toggle("active", x === b));
    render();
  });
}

document.getElementById("q").addEventListener("input", e => { query = e.target.value.trim().toLowerCase(); render(); });

document.getElementById("onlyPicked").addEventListener("change", e => { onlyPicked = e.target.checked; render(); });

document.getElementById("clear").addEventListener("click", () => { picked.clear(); save(); render(); });

function yamlFor(ids) {
  const chosen = ITEMS.filter(it => ids.includes(it.id));
  const lines = ["# 選択した候補。権利確認後に permission_status を approved へ変更する。", "videos:"];
  for (const it of chosen) {
    lines.push(`  # ${it.title} (${it.url})`);
    lines.push(`  - video_id: ${it.id}`);
    lines.push(`    source_url: ${it.url}`);
    lines.push(`    local_path: data/local-videos/${it.id}.mp4`);
    lines.push(`    creator_or_rights_holder: ""`);
    lines.push(`    terms_url: ""`);
    lines.push(`    rights_basis: ""`);
    lines.push(`    permitted_uses: []`);
    lines.push(`    permission_status: pending`);
    lines.push(`    reviewed_by: ""`);
    lines.push(`    reviewed_at: ""`);
    lines.push(`    notes: "視聴して候補化。権利範囲は未確認"`);
  }
  return lines.join("\n");
}

function show(text) {
  const out = document.getElementById("out");
  out.textContent = text;
  out.style.display = "block";
  navigator.clipboard?.writeText(text).catch(() => {});
}

document.getElementById("export").addEventListener("click", () => {
  if (!picked.size) return show("# 何も選択されていません");
  show(yamlFor([...picked]));
});
document.getElementById("exportJson").addEventListener("click", () => {
  const chosen = ITEMS.filter(it => picked.has(it.id));
  show(JSON.stringify(chosen, null, 2));
});

render();
</script>
</body>
</html>
