# ---------------------------------------------------------------- 既知のリスク

risks:
  - id: X-01
    risk: T4 16GB で SDXL 1024 が OOM する
    mitigation: batch=1, grad accumulation, gradient_checkpointing, cache_latents_to_disk, unet only
  - id: X-02
    risk: fp16 VAE で loss が NaN になる (過去に step 25 で発生)
    mitigation: no_half_vae, min_snr_gamma, fp16 mixed precision, step ログ
  - id: X-03
    risk: Kaggle の GPU quota (30h/月) を消費する
    mitigation: 1 回 2h 以内、save_every_n_epochs=2 で途中成果を確保、dry-run で事前確認
  - id: X-04
    risk: 権利・非公開性の破壊 (public 化 / 元動画混入)
    mitigation: private 固定、ZIP 内容検証、push 前ゲート
  - id: X-05
    risk: GitHub Actions から Kaggle 認証できない
    mitigation: KAGGLE_API_TOKEN 対応 + Environment 承認 + 失敗時はローカル CLI で続行
