# LoRA Maker configuration
# Attach the selected dataset(s) to the Kaggle notebook before training.
# Kaggle mount paths may vary; verify actual paths under /kaggle/input.

datasets:
  - id: tyokouchi/yamazaki-shishi-sdxl-dataset
    url: https://www.kaggle.com/datasets/tyokouchi/yamazaki-shishi-sdxl-dataset
    path: /kaggle/input/datasets/tyokouchi/yamazaki-shishi-sdxl-dataset
    instance_prompt: "a photo of yamazaki shishi"
    enabled: true

  - id: tyokouchi/hokusai-manga
    url: https://www.kaggle.com/datasets/tyokouchi/hokusai-manga
    path: /kaggle/input/datasets/tyokouchi/hokusai-manga
    instance_prompt: "a Hokusai manga illustration"
    enabled: true

# The current Python script trains from one dataset path per run.
# Set active_dataset to one of the IDs above when wiring settings.yml into the runner.
active_dataset: tyokouchi/yamazaki-shishi-sdxl-dataset

dataset_options:
  image_extensions:
    - .jpg
    - .jpeg
    - .png
    - .webp
    - .bmp
    - .tif
    - .tiff

model:
  base_model: stabilityai/stable-diffusion-xl-base-1.0

training:
  resolution: 1024
  rank: 16
  max_train_steps: 1000
  learning_rate: 0.0001
  train_batch_size: 1
  gradient_accumulation_steps: 1
  checkpointing_steps: 500
  gradient_checkpointing: true

runtime:
  output_dir: /kaggle/working/lora-maker-output
  work_dir: /kaggle/working/lora-maker
  require_cuda: true
  install_dependencies: true
  internet_required: true

# Suggested quick smoke-test settings before a longer training run:
# training:
#   max_train_steps: 20
