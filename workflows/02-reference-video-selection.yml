version: 1
id: reference-video-selection
name: "Reference video selection"
purpose: "お手本動画の候補を比較し、処理対象の動画セットを人間が確定する"
execution:
  mode: dry_run
  require_explicit_enable: true
  stop_on_error: true
inputs:
  required:
    - domain_decision
    - candidates
  candidates:
    type: array
    item_fields:
      id: string
      source_url: string
      title: string
      creator_or_rights_holder: string
      permission_status: [approved, restricted, unknown, rejected]
      notes: string
evaluation:
  criteria:
    - id: subject_match
      weight: 5
      scale: [1, 5]
    - id: visibility
      weight: 4
      description: "対象が十分な大きさで見え、遮蔽が少ない"
      scale: [1, 5]
    - id: motion_coverage
      weight: 4
      description: "必要なポーズ・動作の種類を含む"
      scale: [1, 5]
    - id: image_quality
      weight: 3
      scale: [1, 5]
    - id: camera_stability
      weight: 2
      scale: [1, 5]
    - id: source_reliability
      weight: 5
      scale: [1, 5]
selection_rules:
  - "permission_status must be approved before processing"
  - "unknown, restricted, and rejected candidates cannot be auto-selected"
  - "scores rank candidates but never replace human approval"
  - "record timestamps and excluded segments where relevant"
outputs:
  - reference-candidates.json
  - reference-review.csv
  - selected-videos.yml
  - selection-record.json
human_approval:
  required: true
  required_fields:
    - selected_video_ids
    - approved_use
    - excluded_time_ranges
next_workflow: workflows/yamazaki-shishi-sdxl.yml
safety:
  - "Do not bypass access controls or platform restrictions"
  - "Do not treat a publicly viewable video as automatically licensed for dataset creation"
