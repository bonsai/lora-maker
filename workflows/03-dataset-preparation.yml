# Workflow 03 — Dataset Preparation
# Canonical flow: approved representative videos → OpenCV PNG → captions → reviewed dataset ZIP.
# This workflow does not train a model and does not publish source media or weights.

version: 1
workflow:
  id: yamazaki-shishi-dataset-preparation
  number: "03"
  name: "Dataset Preparation — ヤマザキシシ"
  purpose: "ししさんの代表的な動画から、非公開実験用のSDXL LoRAデータセットを作る"
  execution:
    mode: dry_run
    require_explicit_enable: true
    stop_on_error: true

project:
  name: yamazaki-shishi
  subject_name: "ヤマザキシシ"
  intended_use: private_experiment
  publication_scope: private_dataset
  base_model: stabilityai/stable-diffusion-xl-base-1.0
  trigger_token: yamazaki_shishi
  training: out_of_scope

upstream:
  domain_decision: workflows/01-domain-decision.yml
  video_discovery_and_selection: workflows/02-reference-video-selection.yml
  required_artifacts:
    - domain-decision.json
    - approval-record.json
    - selected-videos.yml
  require_domain_approval: true
  require_video_selection_approval: true

inputs:
  selected_manifest: selected-videos.yml
  source_type: url
  target_video_count: 7
  allow_count_change_with_approval: true
  validation:
    require_unique_video_ids: true
    require_unique_urls: true
    require_source_provenance: true
    require_use_terms_review: true
    require_human_approval: true
    download_before_approval: false
  acquisition:
    adapter: configurable
    mode: permitted_access_only
    obey_platform_terms: true
    never_bypass_access_controls: true
    cache_dir: data/source-cache
    keep_source_video_out_of_dataset_zip: true

frames:
  extractor: opencv
  output_dir: data/frames
  image_format: png
  extraction:
    method: interval
    interval_seconds: 1.0
    max_frames_per_video: null
    preserve_source_timestamp: true
  image:
    preserve_aspect_ratio: true
    resize: false
    max_dimension: 1024
  deduplication:
    enabled: true
    method: perceptual_hash
    max_hamming_distance: 5
    compare_across_videos: true
  quality_filters:
    reject_corrupt_frames: true
    flag_blurry_frames_for_review: true
    flag_tiny_or_occluded_subject: true
    automatic_delete: false

captions:
  mode: template_then_review
  output_extension: .txt
  initial_template: "{trigger_token}, anime character"
  trigger_token: yamazaki_shishi
  require_one_caption_per_image: true
  manual_review_required: true
  require_factual_visual_description: true
  note: "テンプレート文は仮置き。髪・衣装・構図・表情など実際に見える特徴を確認して修正する。"

dataset:
  output_dir: data/dataset
  layout:
    images_dir: images
    caption_sidecar: same_basename_txt
  naming:
    pattern: "{video_id}_{frame_number:06d}"
  manifest:
    path: manifest.json
    include:
      - source_video_id
      - source_url
      - source_timestamp_seconds
      - image_path
      - caption_path
      - image_width
      - image_height
      - perceptual_hash
      - review_status
  validation:
    reject_corrupt_images: true
    reject_empty_captions: true
    require_image_caption_pairs: true
    report_duplicate_images: true
    reject_unapproved_sources: true
  review:
    contact_sheet_path: data/review/contact-sheet.jpg
    generate_contact_sheet: true
    require_human_approval_before_packaging: true

package:
  output_dir: dist
  filename: yamazaki-shishi-sdxl-dataset.zip
  include: [images/, manifest.json, README.md]
  exclude: [source_videos/, source-cache/, logs/, temporary_files/, local_credentials/]
  verify_zip_after_creation: true
  overwrite_requires_confirmation: true
  intended_visibility: private

kaggle:
  workflow: workflows/04-kaggle-integration.yml
  dataset_slug: yamazaki-shishi-sdxl-dataset
  visibility: private
  upload_automatically: false
  require_human_approval: true
  training_workflow: separate

artifacts:
  run_dir: runs
  log_jsonl: runs/events.jsonl
  summary_json: runs/summary.json

steps:
  - id: validate_domain_approval
    action: validate_approved_domain_decision
    depends_on: []
  - id: validate_selected_videos
    action: validate_selected_video_manifest
    depends_on: [validate_domain_approval]
  - id: approve_acquisition
    action: wait_for_human_approval
    depends_on: [validate_selected_videos]
  - id: acquire_videos
    action: acquire_videos_via_permitted_adapter
    depends_on: [approve_acquisition]
  - id: extract_png_frames
    action: extract_video_frames_with_opencv
    depends_on: [acquire_videos]
  - id: deduplicate_frames
    action: deduplicate_images
    depends_on: [extract_png_frames]
  - id: generate_captions
    action: generate_caption_sidecars
    depends_on: [deduplicate_frames]
  - id: build_manifest
    action: build_dataset_manifest
    depends_on: [generate_captions]
  - id: validate_dataset
    action: validate_image_caption_pairs
    depends_on: [build_manifest]
  - id: create_contact_sheet
    action: create_contact_sheet
    depends_on: [validate_dataset]
  - id: approve_dataset
    action: wait_for_human_approval
    depends_on: [create_contact_sheet]
  - id: package_zip
    action: create_dataset_zip
    depends_on: [approve_dataset]
  - id: verify_zip
    action: verify_dataset_zip
    depends_on: [package_zip]
  - id: prepare_kaggle_upload
    action: create_upload_plan_only
    depends_on: [verify_zip]

safety:
  default_dry_run: true
  no_shell_commands_from_yaml: true
  no_acquisition_before_approval: true
  no_automatic_kaggle_upload: true
  private_visibility_only: true
  no_training_in_this_workflow: true
  no_public_release_without_new_approval: true
  never_overwrite_without_confirmation: true
