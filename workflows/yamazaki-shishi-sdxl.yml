# Yamazaki Shishi SDXL LoRA dataset workflow
# YAML is the source of truth. Python runner and execution validation are separate tasks.
# Private experiment only. This workflow prepares a reviewed dataset; it does not train or publish a model.

version: 1

workflow:
  id: yamazaki-shishi-sdxl-dataset
  name: "Yamazaki Shishi — SDXL LoRA dataset preparation"
  description: "Approved video URLs → OpenCV PNG frames → captions and manifest → human review → ZIP for private Kaggle use."
  execution:
    mode: dry_run
    require_explicit_enable: true
    stop_on_error: true

project:
  name: yamazaki-shishi
  subject_name: "ヤマザキシシ"
  task: character_lora
  intended_use: private_experiment
  publication_scope: private_dataset
  base_model: stabilityai/stable-diffusion-xl-base-1.0
  trigger_token: yamazaki_shishi
  training: out_of_scope
  public_release: prohibited_without_new_approval

upstream:
  domain_decision: workflows/01-domain-decision.yml
  video_selection: workflows/02-reference-video-selection.yml
  required_artifacts:
    - domain-decision.json
    - approval-record.json
    - selected-videos.yml
  require_approved_domain_decision: true
  require_approved_video_selection: true

inputs:
  source_type: youtube_url
  candidate_list: selected-videos.yml
  expected_video_count: 7
  videos:
    - { id: video_01, url: null }
    - { id: video_02, url: null }
    - { id: video_03, url: null }
    - { id: video_04, url: null }
    - { id: video_05, url: null }
    - { id: video_06, url: null }
    - { id: video_07, url: null }
  validation:
    require_all_videos: true
    allow_extra_videos: false
    require_unique_urls: true
    accepted_hosts: [youtube.com, www.youtube.com, youtu.be]
    require_selection_approval: true
    require_source_terms_review: true
    download_before_approval: false
    accepted_container_formats: [.mp4, .mov, .mkv, .webm]
  acquisition:
    mode: permitted_access_only
    adapter: configurable
    obey_platform_terms: true
    never_bypass_access_controls: true
    keep_source_video_out_of_dataset_zip: true
    cache_dir: data/source-cache

frames:
  output_dir: data/frames
  extractor: opencv
  image_format: png
  extraction:
    method: interval
    interval_seconds: 1.0
    max_frames_per_video: null
    preserve_source_timestamp: true
  image:
    preserve_original_aspect_ratio: true
    resize: false
    max_dimension: 1024
  deduplication:
    enabled: true
    method: perceptual_hash
    max_hamming_distance: 5
    compare_across_videos: true

captions:
  mode: template
  output_extension: .txt
  template: "{trigger_token}, anime character"
  variables:
    trigger_token: yamazaki_shishi
  require_one_caption_per_image: true
  manual_review_required: true
  note: "Generic captions are a placeholder; replace them with accurate visual descriptions before training."

dataset:
  output_dir: data/dataset
  image_caption_pairs: true
  naming:
    pattern: "{video_id}_{frame_number:06d}"
  manifest:
    path: manifest.json
    include:
      - source_video_id
      - source_url
      - source_timestamp_seconds
      - image_path
      - caption_path
      - image_width
      - image_height
      - perceptual_hash
  validation:
    reject_corrupt_images: true
    reject_empty_captions: true
    require_image_caption_pairs: true
    report_duplicate_images: true
    reject_unapproved_sources: true
  review:
    generate_contact_sheet: true
    contact_sheet_path: data/review/contact-sheet.jpg
    require_human_approval_before_packaging: true

package:
  output_dir: dist
  filename: yamazaki-shishi-sdxl-dataset.zip
  include:
    - images/
    - manifest.json
    - README.md
  layout:
    images_dir: images
    caption_sidecar: same_basename_txt
  exclude:
    - source_videos/
    - source-cache/
    - logs/
    - temporary_files/
    - local_credentials/
  verify_zip_after_creation: true
  overwrite_requires_confirmation: true
  intended_visibility: private

kaggle:
  workflow: workflows/04-kaggle-integration.yml
  target: private_sdxl_lora_dataset
  dataset_slug: yamazaki-shishi-sdxl-dataset
  visibility: private
  upload_mode: selected_adapter
  upload_automatically: false
  require_human_approval: true
  training_workflow: separate
  public_release: prohibited_without_new_approval

artifacts:
  run_dir: runs
  log_jsonl: runs/events.jsonl
  summary_json: runs/summary.json

steps:
  - id: validate_domain_decision
    action: validate_approved_domain_decision
    depends_on: []
  - id: validate_selected_video_urls
    action: validate_selected_video_manifest
    depends_on: [validate_domain_decision]
  - id: approve_acquisition_plan
    action: wait_for_approval
    depends_on: [validate_selected_video_urls]
  - id: acquire_videos
    action: acquire_videos_via_permitted_adapter
    depends_on: [approve_acquisition_plan]
  - id: extract_frames
    action: extract_video_frames_with_opencv
    depends_on: [acquire_videos]
  - id: deduplicate_frames
    action: deduplicate_images
    depends_on: [extract_frames]
  - id: generate_captions
    action: generate_caption_sidecars
    depends_on: [deduplicate_frames]
  - id: build_manifest
    action: build_dataset_manifest
    depends_on: [generate_captions]
  - id: validate_dataset
    action: validate_image_caption_pairs
    depends_on: [build_manifest]
  - id: create_contact_sheet
    action: create_contact_sheet
    depends_on: [validate_dataset]
  - id: human_review
    action: wait_for_approval
    depends_on: [create_contact_sheet]
  - id: package_dataset
    action: create_dataset_zip
    depends_on: [human_review]
  - id: verify_package
    action: verify_dataset_zip
    depends_on: [package_dataset]
  - id: prepare_kaggle_upload
    action: create_upload_plan_only
    depends_on: [verify_package]

safety:
  default_dry_run: true
  no_shell_commands_from_yaml: true
  no_download_before_source_and_use_approval: true
  no_automatic_kaggle_upload: true
  private_visibility_only: true
  no_training_in_this_workflow: true
  no_public_release_without_new_approval: true
  never_overwrite_existing_package_without_confirmation: true
